name: CI - Mesa de Solicitudes

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend - Lint, Build y Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Analizar código (lint)
        run: npm run lint

      - name: Compilar backend
        run: npm run build

      - name: Ejecutar pruebas unitarias
        run: npm test

      - name: Ejecutar pruebas de extremo a extremo
        run: npm run test:e2e

  frontend:
    name: Frontend - Build y Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Configurar Chrome
        uses: browser-actions/setup-chrome@v2

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar frontend
        run: npm run build

      - name: Ejecutar pruebas frontend
        run: npm run test:ci

  infrastructure:
    name: AWS CDK - Validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: infra/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar infraestructura
        run: npm run build

      - name: Sintetizar plantilla CloudFormation
        run: npx cdk synth
